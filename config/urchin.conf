# Name
CONFIG_ZMK_KEYBOARD_NAME="Urchin"

# enable bluetooth
CONFIG_BT=y # not sure if this is needed, but it doesn't hurt to be explicit

# Enter idle state after 30s (BLE increases connection interval, saving power)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep after 15 minutes of inactivity
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_SLEEP=y

# TX power at 0 dBm (default; was +8 dBm for range, but costs significantly more battery)
# Increase back to PLUS_4 or PLUS_8 if the split halves become unstable
CONFIG_BT_CTLR_TX_PWR_0=y

# Debounce (default is 5ms; increased to reduce key chatter)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=10

# Enable mouse
CONFIG_ZMK_POINTING=y

# Battery level reporting (as per https://github.com/kot149/zmk-battery-center)
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# For split keyboards:
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y